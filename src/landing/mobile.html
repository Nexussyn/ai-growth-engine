<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>x402 AI Growth Engine — Mobile Connect</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.35);
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --border: #1f2937;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 20px;
    }
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }
    .badge {
      display: inline-block;
      align-self: center;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid rgba(59, 130, 246, 0.3);
      margin-bottom: 20px;
    }
    h1 {
      font-size: 32px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }
    p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .wallet-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    .wallet-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      background: var(--card);
      border: 1px solid var(--border);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .wallet-btn.primary {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border: none;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .wallet-btn:active {
      transform: scale(0.98);
    }
    .meta-status {
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
    }
    footer {
      text-align: center;
      font-size: 11px;
      color: #6b7280;
      padding-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <div class="meta-status">
      <span class="status-dot"></span>
      <span>Base Chain Mainnet Active</span>
    </div>
  </header>

  <main class="hero">
    <div class="badge">x402 Protocol Mobile</div>
    <h1>Earn USDC for Autonomous Agent Contributions</h1>
    <p>Connect your web3 mobile wallet to claim bounties, execute agent tasks, and receive instant on-chain payouts.</p>

    <div class="wallet-options">
      <button class="wallet-btn primary" onclick="connectWallet('metamask')">
        🦊 Connect with MetaMask
      </button>
      <button class="wallet-btn" onclick="connectWallet('coinbase')">
        🔵 Coinbase Wallet
      </button>
      <button class="wallet-btn" onclick="connectWallet('rainbow')">
        🌈 Rainbow Wallet
      </button>
    </div>
  </main>

  <footer>
    x402 Agent Growth Engine &copy; 2026 &middot; Ultra-low Latency Pay-per-call
  </footer>

  <script>
    function getHostDappUrl() {
      return encodeURIComponent(window.location.href);
    }

    function isMobile() {
      return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 768;
    }

    function trackEvent(eventType, payload) {
      console.log(`[Event Logged]: ${eventType}`, payload);
      if (window.parent) {
        window.parent.postMessage({ type: 'TRACK_EVENT', eventType, payload }, '*');
      }
    }

    function connectWallet(provider) {
      trackEvent('mobile_landing_cta_click', {
        provider,
        userAgent: navigator.userAgent,
        isMobile: isMobile(),
        timestamp: new Date().toISOString()
      });

      const dappUrl = getHostDappUrl();
      let deepLink = '';

      if (provider === 'metamask') {
        deepLink = `https://metamask.app.link/dapp/${window.location.host}${window.location.pathname}`;
      } else if (provider === 'coinbase') {
        deepLink = `https://go.cb-w.com/dapp?cb_url=${dappUrl}`;
      } else if (provider === 'rainbow') {
        deepLink = `https://rnbwapp.com/wc?uri=${dappUrl}`;
      }

      if (isMobile()) {
        window.location.href = deepLink;
      } else {
        alert(`Connecting via ${provider}... Open this URL on your mobile wallet browser for instant deep-linking.`);
      }
    }
  </script>
</body>
</html>
