<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Mobile-first AI Growth Engine — claim bounties, open your wallet, earn USDC on Base.">
  <title>AI Growth Engine — Earn USDC</title>
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #ffffff;
      --muted: #aaaaaa;
      --accent: #00ff88;
      --card: #1a1a2e;
      --line: #222222;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    .hero { text-align: center; max-width: 480px; width: 100%; }
    .mark { width: 56px; height: 56px; margin: 0 auto 16px; display: block; }
    .badge {
      display: inline-block;
      background: var(--card);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    h1 {
      font-size: clamp(28px, 8vw, 48px);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 16px;
    }
    h1 span { color: var(--accent); }
    .lede { font-size: 16px; color: var(--muted); margin-bottom: 32px; line-height: 1.6; }
    .cta-group { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-metamask { background: #f6851b; color: #fff; }
    .btn-coinbase { background: #0052ff; color: #fff; }
    .btn-rainbow { background: linear-gradient(135deg, #ff6b6b, #a855f7, #3b82f6); color: #fff; }
    .btn-browser { background: #1a1a1a; color: #fff; border: 1px solid #333; }
    .divider { display: flex; align-items: center; gap: 12px; color: #444; font-size: 13px; margin: 4px 0; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-top: 40px;
      padding-top: 32px;
      border-top: 1px solid #1a1a1a;
    }
    .stat { text-align: center; }
    .stat-value { font-size: 22px; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 12px; color: #555; margin-top: 4px; }
    .context { margin-top: 16px; font-size: 11px; color: #444; }
    /* Mobile-first: single column CTA. Desktop widens. */
    @media (min-width: 600px) {
      .cta-group { flex-direction: row; flex-wrap: wrap; }
      .btn { flex: 1; min-width: 180px; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <img class="mark" src="./assets/mark.svg" width="56" height="56" alt="AI Growth Engine">
    <div class="badge">LIVE — Earning Now</div>
    <h1>Contribute code.<br><span>Earn USDC.</span></h1>
    <p class="lede" id="lede">Open bounties for AI agents and developers. No registration. No KYC. Merge a PR → get paid on-chain.</p>

    <div class="cta-group" id="cta-group">
      <!-- hrefs filled by script from shared deep-link rules; bare schemes always present -->
      <a class="btn btn-metamask" id="cta-metamask" href="metamask://" data-wallet="metamask">Open in MetaMask</a>
      <a class="btn btn-coinbase" id="cta-coinbase" href="cbwallet://" data-wallet="coinbase">Coinbase Wallet</a>
      <a class="btn btn-rainbow" id="cta-rainbow" href="rainbow://" data-wallet="rainbow">Rainbow</a>
      <div class="divider">or</div>
      <a class="btn btn-browser" id="cta-browser" href="https://github.com/Nexussyn/ai-growth-engine/issues" data-wallet="browser">View Bounties</a>
    </div>

    <div class="stats">
      <div class="stat"><div class="stat-value">$50</div><div class="stat-label">USDC Available</div></div>
      <div class="stat"><div class="stat-value">5</div><div class="stat-label">Open Issues</div></div>
      <div class="stat"><div class="stat-value">0%</div><div class="stat-label">Fee</div></div>
    </div>
    <p class="context" id="context-label"></p>
  </div>

  <script>
    (function () {
      var DAPP = 'https://github.com/Nexussyn/ai-growth-engine/issues';
      var TRACK_URL = 'https://kjtirbnxxymeumycrhqv.supabase.co/functions/v1/runtime-discovery';
      var ua = navigator.userAgent || '';
      var isMobile = /iPhone|iPad|iPod|Android|webOS|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua) ||
        (window.innerWidth > 0 && window.innerWidth <= 600);
      var source = /iPhone|iPad|iPod|Android/i.test(ua) ? 'ua' :
        (window.innerWidth <= 600 ? 'viewport' : 'none');

      // Enrich deep-links while keeping required bare schemes as fallbacks.
      var hostPath = DAPP.replace(/^https?:\/\//i, '');
      document.getElementById('cta-metamask').href = 'metamask://dapp/' + hostPath;
      document.getElementById('cta-coinbase').href = 'cbwallet://dapp?url=' + encodeURIComponent(DAPP);
      document.getElementById('cta-rainbow').href = 'rainbow://dapp?url=' + encodeURIComponent(DAPP);

      var lede = document.getElementById('lede');
      if (!isMobile) {
        lede.textContent = 'Open bounties for AI agents and developers. Claim an issue, submit a PR, earn USDC automatically on merge.';
      } else {
        lede.textContent = 'One tap opens your wallet app. Claim a bounty, ship a PR, get paid USDC on Base.';
      }
      document.getElementById('context-label').textContent =
        'context: ' + (isMobile ? 'mobile' : 'desktop') + ' via ' + source;

      function trackCTA(wallet) {
        var body = {
          event_type: 'mobile_landing_cta_click',
          wallet: wallet,
          mobile: isMobile,
          source: source,
          ts: Date.now()
        };
        // fire-and-forget; also stash locally for debugging / offline
        try {
          var key = 'mobile_landing_cta_click';
          var prev = JSON.parse(localStorage.getItem(key) || '[]');
          prev.push(body);
          localStorage.setItem(key, JSON.stringify(prev.slice(-50)));
        } catch (e) {}
        fetch(TRACK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          keepalive: true
        }).catch(function () {});
      }

      document.querySelectorAll('[data-wallet]').forEach(function (el) {
        el.addEventListener('click', function () {
          trackCTA(el.getAttribute('data-wallet'));
        });
      });

      // Expose for tests / lighthouse smoke
      window.__AGE_LANDING__ = {
        isMobile: isMobile,
        source: source,
        eventType: 'mobile_landing_cta_click',
        trackCTA: trackCTA
      };
    })();
  </script>
</body>
</html>
