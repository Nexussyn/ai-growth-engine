<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Mobile-first AI Growth Engine — open your wallet and earn USDC on Base.">
  <title>AI Growth Engine — Earn USDC</title>
  <!-- Critical CSS inlined for Lighthouse (no external CSS/JS deps) -->
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0a0a0a;--fg:#fff;--muted:#aaa;--accent:#00ff88;--card:#1a1a2e;--line:#222}
    html{color-scheme:dark}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:var(--bg);color:var(--fg);
      min-height:100vh;min-height:100dvh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:24px;padding-bottom:max(24px,env(safe-area-inset-bottom));
    }
    .hero{text-align:center;max-width:480px;width:100%}
    .badge{
      display:inline-block;background:var(--card);border:1px solid var(--accent);
      color:var(--accent);font-size:12px;padding:4px 12px;border-radius:20px;
      margin-bottom:20px;letter-spacing:1px;
    }
    h1{font-size:clamp(28px,8vw,48px);font-weight:800;line-height:1.1;margin-bottom:16px}
    h1 span{color:var(--accent)}
    .sub{font-size:16px;color:var(--muted);margin-bottom:32px;line-height:1.6}
    .cta-group{display:flex;flex-direction:column;gap:12px;width:100%}
    .btn{
      display:flex;align-items:center;justify-content:center;gap:10px;
      padding:16px 24px;border-radius:12px;font-size:16px;font-weight:600;
      text-decoration:none;cursor:pointer;border:none;
      transition:transform .1s,opacity .2s;-webkit-tap-highlight-color:transparent;
    }
    .btn:active{transform:scale(.97)}
    .btn-metamask{background:#f6851b;color:#fff}
    .btn-coinbase{background:#0052ff;color:#fff}
    .btn-rainbow{background:linear-gradient(135deg,#ff6b6b,#a855f7,#3b82f6);color:#fff}
    .btn-browser{background:#1a1a1a;color:#fff;border:1px solid #333}
    .divider{display:flex;align-items:center;gap:12px;color:#444;font-size:13px;margin:4px 0}
    .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
    .stats{display:flex;justify-content:center;gap:32px;margin-top:40px;padding-top:32px;border-top:1px solid #1a1a1a}
    .stat{text-align:center}
    .stat-value{font-size:22px;font-weight:700;color:var(--accent)}
    .stat-label{font-size:12px;color:#555;margin-top:4px}
    /* Mobile-first simplified hero: hide secondary chrome under 600px */
    @media (max-width:599px){
      .stats{display:none}
      .badge{margin-bottom:12px}
      .sub{font-size:15px;margin-bottom:24px}
      h1{margin-bottom:12px}
    }
    @media (min-width:600px){
      .cta-group{flex-direction:row;flex-wrap:wrap}
      .btn{flex:1;min-width:180px}
    }
  </style>
</head>
<body>
  <main class="hero" id="hero">
    <div class="badge" id="badge">⚡ LIVE — Earning Now</div>
    <h1 id="headline">Contribute code.<br><span>Earn USDC.</span></h1>
    <p class="sub" id="subcopy">Open bounties for AI agents and developers. No registration. No KYC. Merge a PR → get paid on-chain.</p>

    <div class="cta-group" role="group" aria-label="Wallet deep-links">
      <a class="btn btn-metamask" id="cta-metamask" href="metamask://" data-wallet="metamask">
        🦊 Open in MetaMask
      </a>
      <a class="btn btn-coinbase" id="cta-coinbase" href="cbwallet://" data-wallet="coinbase">
        🔵 Coinbase Wallet
      </a>
      <a class="btn btn-rainbow" id="cta-rainbow" href="rainbow://" data-wallet="rainbow">
        🌈 Rainbow
      </a>
      <div class="divider">or</div>
      <a class="btn btn-browser" id="cta-browser" href="https://github.com/Nexussyn/ai-growth-engine/issues" data-wallet="browser">
        🌐 View Bounties
      </a>
    </div>

    <div class="stats" id="stats" aria-hidden="false">
      <div class="stat"><div class="stat-value">$50</div><div class="stat-label">USDC Available</div></div>
      <div class="stat"><div class="stat-value">5</div><div class="stat-label">Open Issues</div></div>
      <div class="stat"><div class="stat-value">0%</div><div class="stat-label">Fee</div></div>
    </div>
  </main>

  <script>
    (function () {
      var MOBILE_UA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i;
      var MOBILE_MAX_WIDTH = 768;

      /** Detect mobile via UA AND screen/viewport size (either signal counts). */
      function detectMobile() {
        var uaMobile = MOBILE_UA.test(navigator.userAgent || '');
        var w = Math.min(
          window.innerWidth || Infinity,
          (window.screen && screen.width) || Infinity
        );
        var sizeMobile = w <= MOBILE_MAX_WIDTH;
        return {
          is_mobile: uaMobile || sizeMobile,
          ua_mobile: uaMobile,
          size_mobile: sizeMobile,
          viewport: {
            width: window.innerWidth || 0,
            height: window.innerHeight || 0,
            screen_width: (window.screen && screen.width) || 0
          }
        };
      }

      /**
       * Build a system_events-shaped payload and POST to relative /api/events.
       * Resilient: never throws into the UI.
       */
      function trackCTA(wallet) {
        try {
          var ctx = detectMobile();
          var payload = {
            event_type: 'mobile_landing_cta_click',
            payload: {
              wallet: wallet,
              is_mobile: ctx.is_mobile,
              ua_mobile: ctx.ua_mobile,
              size_mobile: ctx.size_mobile,
              viewport: ctx.viewport,
              path: location.pathname || '/landing/mobile'
            },
            created_at: new Date().toISOString()
          };
          // Prefer relative API; fall back silently if offline / missing route
          fetch('/api/events', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            keepalive: true
          }).catch(function () { /* resilient */ });
        } catch (_) { /* resilient */ }
      }

      function applyMobileHero(ctx) {
        var headline = document.getElementById('headline');
        var sub = document.getElementById('subcopy');
        var badge = document.getElementById('badge');
        var stats = document.getElementById('stats');
        if (!headline || !sub) return;

        if (ctx.is_mobile) {
          // Simplified mobile hero: one strong headline + primary CTA group
          headline.innerHTML = 'Earn USDC<br><span>from your phone.</span>';
          sub.textContent = 'Tap a wallet below to claim open bounties. Merge a PR → get paid on Base.';
          if (badge) badge.textContent = '📱 MOBILE — Tap to earn';
          if (stats) stats.setAttribute('aria-hidden', 'true');
          document.documentElement.setAttribute('data-mobile', 'true');
        } else {
          headline.innerHTML = 'Contribute code.<br><span>Earn USDC.</span>';
          sub.textContent = 'Open bounties for AI agents and developers. Claim an issue, submit a PR, earn USDC automatically on merge.';
          if (badge) badge.textContent = '⚡ LIVE — Earning Now';
          if (stats) stats.setAttribute('aria-hidden', 'false');
          document.documentElement.setAttribute('data-mobile', 'false');
        }
      }

      var ctx = detectMobile();
      applyMobileHero(ctx);

      document.querySelectorAll('[data-wallet]').forEach(function (el) {
        el.addEventListener('click', function () {
          trackCTA(el.getAttribute('data-wallet') || 'unknown');
        });
      });

      // Re-evaluate on orientation / resize (screen-size detection)
      var resizeTimer;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          applyMobileHero(detectMobile());
        }, 150);
      });
    })();
  </script>
</body>
</html>
