<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Growth Engine – Mobile Landing</title>
  <style>
    /* Reset & basic typography */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f9fafb; color: #111; }

    /* Hero section – mobile‑first */
    .hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
      padding: 1rem;
    }
    .hero h1 {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      line-height: 1.2;
    }
    .cta-grid {
      display: grid;
      gap: 0.75rem;
      width: 100%;
      max-width: 320px;
    }
    .cta-btn {
      display: block;
      width: 100%;
      padding: 0.85rem;
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      border-radius: 0.5rem;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .cta-btn.metamask { background:#f6851b; color:#fff; }
    .cta-btn.coinbase { background:#0052ff; color:#fff; }
    .cta-btn.rainbow { background:#ff5c5c; color:#fff; }

    .cta-btn:hover { opacity:0.9; }

    /* Hide the page on non‑mobile devices */
    @media (min-width: 768px) {
      .hero { display: none; }
    }
  </style>
</head>
<body>
  <section class="hero" id="mobile-hero">
    <h1>Start your AI‑powered growth journey</h1>
    <div class="cta-grid">
      <a href="metamask://" class="cta-btn metamask" data-wallet="metamask">Open in MetaMask</a>
      <a href="cbwallet://" class="cta-btn coinbase" data-wallet="coinbase">Open in Coinbase Wallet</a>
      <a href="rainbow://" class="cta-btn rainbow" data-wallet="rainbow">Open in Rainbow</a>
    </div>
  </section>

  <script>
    // Simple mobile detection – if not mobile, redirect to desktop landing (if exists)
    (function() {
      const isMobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      if (!isMobile) {
        // Assuming a desktop landing page exists at /index.html
        window.location.href = '/index.html';
      }
    })();

    // Event tracking – send a POST to the backend when a CTA is clicked
    const trackEvent = async (wallet) => {
      try {
        await fetch('/api/events', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            event: 'mobile_landing_cta_click',
            wallet,
            timestamp: new Date().toISOString()
          })
        });
      } catch (e) {
        // Silently ignore tracking errors – they should not block the deep‑link
        console.error('Event tracking failed', e);
      }
    };

    document.querySelectorAll('.cta-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const wallet = e.currentTarget.dataset.wallet;
        // Fire tracking before the deep‑link navigation
        trackEvent(wallet);
        // No need to preventDefault – the href will trigger the deep‑link
      });
    });
  </script>
</body>
</html>
