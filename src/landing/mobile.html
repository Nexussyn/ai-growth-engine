<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contribute to open coding bounties and earn USDC when your work is accepted.">
  <title>AI Growth Engine — Earn USDC</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { text-align: center; max-width: 480px; width: 100%; }
    .badge { display: inline-block; border: 1px solid #00ff88; color: #00ff88; font-size: 12px; padding: 6px 12px; border-radius: 20px; letter-spacing: 1px; }
    h1 { font-size: clamp(32px, 8vw, 48px); font-weight: 800; line-height: 1.1; margin: 24px 0 16px; }
    h1 span { color: #00ff88; }
    p { font-size: 16px; color: #bbb; line-height: 1.6; }
    label { display: block; text-align: left; margin: 24px 0 8px; }
    select, .cta { width: 100%; min-height: 52px; border-radius: 12px; font: inherit; }
    #wallet-choice { position: relative; }
    #wallet-choice::after { content: '⌄'; position: absolute; right: 16px; bottom: 14px; pointer-events: none; }
    select { appearance: none; -webkit-appearance: none; padding: 12px 40px 12px 12px; background: #191919; color: #fff; border: 1px solid #777; }
    .cta { display: flex; align-items: center; justify-content: center; padding: 16px; margin-top: 16px; background: #00ff88; color: #052718; font-weight: 700; text-decoration: none; }
    :focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .note { font-size: 14px; margin-top: 20px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="badge">OPEN CODING BOUNTIES</div>
    <h1>Contribute code.<br><span>Earn USDC.</span></h1>
    <p>Choose an open issue. Submit your work. Earn a reward when your contribution is accepted.</p>
    <div id="wallet-choice" hidden>
      <label for="wallet">Your wallet app</label>
      <select id="wallet">
        <option value="metamask">MetaMask</option>
        <option value="coinbase">Coinbase Wallet</option>
        <option value="rainbow">Rainbow</option>
      </select>
    </div>
    <a class="cta" href="https://github.com/Nexussyn/ai-growth-engine/issues">View open bounties</a>
    <p class="note" id="wallet-note" hidden>Open your installed wallet app. No payment or wallet connection is requested.</p>
  </main>
  <script>
    const wallets = { metamask: 'metamask://', coinbase: 'cbwallet://', rainbow: 'rainbow://' };
    const wallet = document.getElementById('wallet');
    const cta = document.querySelector('.cta');
    const viewport = window.matchMedia('(max-width: 600px)');
    const mobileAgent = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    let isMobile;
    function updateCTA() {
      isMobile = mobileAgent || viewport.matches;
      document.getElementById('wallet-choice').hidden = !isMobile;
      document.getElementById('wallet-note').hidden = !isMobile;
      cta.href = isMobile ? wallets[wallet.value] : 'https://github.com/Nexussyn/ai-growth-engine/issues';
      cta.textContent = isMobile ? 'Open ' + wallet.selectedOptions[0].text : 'View open bounties';
    }
    wallet.addEventListener('change', updateCTA);
    viewport.addEventListener('change', updateCTA);
    updateCTA();
    cta.addEventListener('click', () => {
      fetch('/api/landing-events', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        keepalive: true,
        body: JSON.stringify({ wallet: isMobile ? wallet.value : 'browser', device: isMobile ? 'mobile' : 'desktop' }),
      }).catch(() => {});
    });
  </script>
</body>
</html>
