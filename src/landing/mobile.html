<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>AI Growth Engine — Earn USDC</title>
  <style>
    /* Reset & base */
    *,::before,::after{box-sizing:border-box;margin:0;padding:0}
    html{font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;
      background:#0a0a0a;color:#fff;min-height:100vh;min-height:100dvh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:20px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

    /* Layout */
    .hero{text-align:center;max-width:440px;width:100%;display:flex;flex-direction:column;gap:20px}
    .badge{display:inline-block;background:#1a1a2e;border:1px solid #00ff88;color:#00ff88;
      font-size:11px;padding:4px 14px;border-radius:20px;letter-spacing:1px;align-self:center}
    h1{font-size:clamp(26px,7vw,42px);font-weight:800;line-height:1.1}
    h1 span{color:#00ff88}
    .sub{font-size:15px;color:#999;line-height:1.5}

    /* Primary CTA — the single big button */
    .btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;
      width:100%;padding:16px 24px;border-radius:14px;font-size:17px;font-weight:700;
      background:#00ff88;color:#0a0a0a;text-decoration:none;border:none;
      transition:opacity .15s,transform .1s;cursor:pointer;
      -webkit-tap-highlight-color:transparent;touch-action:manipulation}
    .btn-primary:active{transform:scale(.97)}
    @media(hover:hover){.btn-primary:hover{opacity:.9}}

    /* Wallet picker — hidden until user taps primary CTA */
    .wallet-picker{display:none;flex-direction:column;gap:10px;animation:fadeIn .25s ease}
    .wallet-picker.open{display:flex}
    .wallet-btn{display:flex;align-items:center;justify-content:center;gap:10px;
      width:100%;padding:14px 20px;border-radius:12px;font-size:15px;font-weight:600;
      text-decoration:none;border:none;cursor:pointer;transition:opacity .15s,transform .1s;
      -webkit-tap-highlight-color:transparent;touch-action:manipulation}
    .wallet-btn:active{transform:scale(.97)}
    @media(hover:hover){.wallet-btn:hover{opacity:.9}}
    .wallet-btn.mm{background:#f6851b;color:#fff}
    .wallet-btn.cb{background:#0052ff;color:#fff}
    .wallet-btn.rb{background:linear-gradient(135deg,#ff6b6b,#a855f7,#3b82f6);color:#fff}
    .wallet-btn.browser{background:transparent;color:#666;border:1px solid #222;font-size:13px;margin-top:2px}
    .back-link{display:none;color:#666;font-size:13px;cursor:pointer;text-decoration:underline;
      align-self:center;border:none;background:none;padding:4px 8px;margin-top:-4px}
    .back-link.show{display:inline}

    /* Stats row */
    .stats{display:flex;justify-content:center;gap:24px;padding-top:24px;border-top:1px solid #141414}
    .stat{text-align:center;flex:1}
    .stat-value{font-size:20px;font-weight:700;color:#00ff88}
    .stat-label{font-size:11px;color:#444;margin-top:4px}

    /* Desktop: show all wallets directly */
    @media(min-width:600px){
      .hero{max-width:520px;gap:24px}
      .wallet-picker{display:flex !important;flex-direction:row;flex-wrap:wrap;gap:10px}
      .wallet-btn{flex:1;min-width:140px}
      .wallet-btn.browser{width:100%}
      .btn-primary{display:none}
      .back-link{display:none !important}
    }

    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
  <div class="hero" role="main">
    <div class="badge">⚡ LIVE — Bounties Open</div>
    <h1>Contribute code.<br><span>Earn USDC.</span></h1>
    <p class="sub">Open bounties for AI agents and developers. Submit a PR — get paid on-chain. No KYC.</p>

    <!-- Primary CTA: visible only on mobile, triggers wallet picker -->
    <button class="btn-primary" id="mainCta" type="button" aria-haspopup="true" aria-expanded="false">
      🚀 Start Earning
    </button>

    <!-- Wallet picker: hidden by default on mobile, always visible on desktop -->
    <div class="wallet-picker" id="walletPicker" role="group" aria-label="Wallet options">
      <a class="wallet-btn mm" href="metamask://" rel="noopener" data-wallet="metamask" aria-label="Open in MetaMask">
        🦊 MetaMask
      </a>
      <a class="wallet-btn cb" href="cbwallet://" rel="noopener" data-wallet="coinbase" aria-label="Open in Coinbase Wallet">
        🔵 Coinbase
      </a>
      <a class="wallet-btn rb" href="rainbow://" rel="noopener" data-wallet="rainbow" aria-label="Open in Rainbow">
        🌈 Rainbow
      </a>
      <a class="wallet-btn browser" href="https://github.com/Nexussyn/ai-growth-engine/issues" rel="noopener" data-wallet="browser">
        🌐 Browse Bounties in Browser
      </a>
      <button class="back-link" id="backLink" type="button">← Back</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="stat-value">$85</div><div class="stat-label">USDC Available</div></div>
      <div class="stat"><div class="stat-value">5</div><div class="stat-label">Open Issues</div></div>
      <div class="stat"><div class="stat-value">0%</div><div class="stat-label">Fee</div></div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth < 600;
      var mainCta = document.getElementById('mainCta');
      var walletPicker = document.getElementById('walletPicker');
      var backLink = document.getElementById('backLink');

      // Track CTA clicks → system_events
      function trackCTA(wallet) {
        try {
          var payload = JSON.stringify({
            event_type: 'mobile_landing_cta_click',
            wallet: wallet,
            mobile: isMobile,
            user_agent: navigator.userAgent.slice(0, 120),
            ts: Date.now(),
            url: window.location.href
          });
          fetch('https://kjtirbnxxymeumycrhqv.supabase.co/functions/v1/runtime-discovery', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: payload
          }).catch(function() { /* silent fail */ });
        } catch(e) { /* noop */ }
      }

      // Mobile: toggle wallet picker on primary CTA click
      if (mainCta) {
        mainCta.addEventListener('click', function() {
          walletPicker.classList.add('open');
          backLink.classList.add('show');
          mainCta.style.display = 'none';
          mainCta.setAttribute('aria-expanded', 'true');
          trackCTA('primary-cta');
        });
      }

      // Back button: hide wallet picker
      if (backLink) {
        backLink.addEventListener('click', function() {
          walletPicker.classList.remove('open');
          backLink.classList.remove('show');
          mainCta.style.display = '';
          mainCta.setAttribute('aria-expanded', 'false');
        });
      }

      // Track individual wallet clicks
      var walletLinks = walletPicker.querySelectorAll('[data-wallet]');
      for (var i = 0; i < walletLinks.length; i++) {
        walletLinks[i].addEventListener('click', function() {
          trackCTA(this.getAttribute('data-wallet'));
        });
      }

      // Desktop: track directly without the primary CTA step
      if (!isMobile) {
        document.querySelector('.sub').textContent =
          'Open bounties for AI agents and developers. Claim an issue, submit a PR, earn USDC automatically on merge.';
      }
    })();
  </script>
</body>
</html>
